<!DOCTYPE html>
<html lang="vi">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lịch Học</title>
    <link rel="icon" type="image/jpg" href="calendar-icon.jpg">

    <!-- PWA / iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lịch Học">
    <link rel="apple-touch-icon" href="calendar.png">
    <meta name="theme-color" content="#0eb2fd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Dark mode scrollbar */
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* --- Custom Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            70% { transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; opacity: 0; }
        .animate-slide-right { animation: slideInRight 0.4s ease-out forwards; opacity: 0; }
        .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-soft-pulse { animation: softPulse 2s ease-in-out infinite; }

        @keyframes softPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.96); }
        }

        /* Interactive Hover Effects */
        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .dark .hover-lift:hover {
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white transition-colors duration-300">

    <header class="bg-indigo-600 dark:bg-slate-900 text-white shadow-md border-b border-transparent dark:border-slate-800 sticky top-0 z-30 transition-colors duration-300 animate-fade-in">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 sm:py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="themeToggleBtn" aria-label="Đổi giao diện" class="p-1.5 rounded-lg hover:bg-white/20 active:scale-90 transition-all flex items-center justify-center">
                    <i id="themeIcon" data-lucide="calendar" class="w-6 h-6 sm:w-7 sm:h-7 transition-transform duration-300"></i>
                </button>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Lịch Học</h1>
            </div>
            <button id="openAddModalBtn" class="hidden sm:flex bg-white dark:bg-indigo-600 text-indigo-600 dark:text-white hover:bg-indigo-50 dark:hover:bg-indigo-700 font-semibold px-4 py-2 rounded-lg shadow hover-lift items-center gap-2 transition-all">
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                <span>Thêm Lịch Học</span>
            </button>
        </div>
    </header>

    <!-- Floating Action Button for Mobile -->
    <button id="mobileFabBtn" aria-label="Thêm lịch học" class="sm:hidden fixed bottom-16 right-3 w-14 h-14 bg-indigo-600 dark:bg-indigo-500 text-white rounded-full shadow-2xl flex items-center justify-center z-40 active:scale-90 transition-transform focus:outline-none border-2 border-white dark:border-slate-800">
        <i data-lucide="plus" class="w-7 h-7"></i>
    </button>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 lg:gap-8">
            
            <!-- Left 2 Columns: Calendar View -->
            <div class="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-3.5 sm:p-6 flex flex-col transition-colors duration-300 animate-slide-up" style="animation-delay: 100ms;">
                
                <!-- Calendar Header / Controls -->
                <div class="flex items-center justify-between mb-4 sm:mb-6 gap-2 sm:gap-3 flex-wrap sm:flex-nowrap">
                    <div class="flex items-center space-x-2 gap-1.5 shrink-0">
                        <h2 id="currentMonthYear" class="text-lg sm:text-2xl font-bold text-slate-800 dark:text-slate-100 capitalize whitespace-nowrap transition-all">...</h2>
                        <button id="todayBtn" class="text-xs bg-indigo-50 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/80 font-medium px-2 py-1 rounded-md border border-indigo-200 dark:border-indigo-800/50 transition shrink-0 active:scale-95">Hôm nay</button>
                    </div>

                    <!-- Month / Week View Toggle Switch -->
                    <div class="flex items-center space-x-1.5 sm:space-x-2 bg-slate-100 dark:bg-slate-800 p-1 sm:p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">
                        <span class="text-[11px] sm:text-xs font-semibold text-slate-700 dark:text-slate-300 pl-0.5 sm:pl-1 flex items-center gap-1 select-none">
                            <i data-lucide="calendar" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-indigo-600 dark:text-indigo-400"></i>
                            <span class="xs:inline sm:inline">Rút gọn</span>
                        </span>
                        <button id="compactToggleBtn" type="button" role="switch" aria-checked="true" aria-label="Bật tắt chế độ xem tháng hoặc tuần"
                            class="w-10 h-5 sm:w-11 sm:h-6 bg-indigo-600 rounded-full p-0.5 sm:p-1 transition-colors duration-300 ease-in-out focus:outline-none flex items-center justify-start shadow-inner">
                            <span id="compactToggleThumb" class="w-4 h-4 bg-white rounded-full shadow-md transform transition-transform duration-300 ease-in-out translate-x-5"></span>
                        </button>
                    </div>
                        
                    <div class="flex items-center space-x-2 sm:space-x-3 ml-auto shrink-0">
                        <div class="flex items-center space-x-1 sm:space-x-2 shrink-0">
                            <button id="prevMonthBtn" aria-label="Trước" class="p-1.5 sm:p-2 hover:bg-slate-100 dark:hover:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 active:scale-90 rounded-lg text-slate-600 dark:text-slate-400 transition-all">
                                <i data-lucide="chevron-left" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                            </button>
                            <button id="nextMonthBtn" aria-label="Sau" class="p-1.5 sm:p-2 hover:bg-slate-100 dark:hover:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 active:scale-90 rounded-lg text-slate-600 dark:text-slate-400 transition-all">
                                <i data-lucide="chevron-right" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Days of Week Header -->
                <div class="grid grid-cols-7 text-center font-semibold text-slate-500 dark:text-slate-400 text-xs sm:text-sm mb-2 animate-fade-in" style="animation-delay: 200ms;">
                    <div class="py-1">T2</div>
                    <div class="py-1">T3</div>
                    <div class="py-1">T4</div>
                    <div class="py-1">T5</div>
                    <div class="py-1">T6</div>
                    <div class="py-1 text-indigo-600 dark:text-indigo-400">T7</div>
                    <div class="py-1 text-rose-500 dark:text-rose-400">CN</div>
                </div>

                <!-- Calendar Grid Container (Animation applied via JS) -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 flex-grow touch-pan-y select-none transition-all duration-300">
                    <!-- Days dynamically inserted here -->
                </div>
            </div>

            <div class="space-y-6">
                
                <!-- Selected Day Schedule -->
                <div id="" class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 transition-colors duration-300 animate-slide-right" style="animation-delay: 150ms;">
                    <div class="flex items-center justify-between mb-4 border-b border-slate-100 dark:border-slate-800 pb-3">
                        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg flex items-center gap-2">
                            <i data-lucide="clock" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
                            <span id="selectedDateTitle">Lịch Học Hôm Nay</span>
                        </h3>
                        <span id="selectedDateText" class="text-sm font-medium text-slate-500 dark:text-slate-400">--/--/----</span>
                    </div>

                    <div id="dayScheduleList" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                        <!-- Classes inserted here via JS with staggering -->
                    </div>
                </div>

                <!-- Course List Overview -->
                <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 flex-1 flex flex-col transition-colors duration-300 animate-slide-right" style="animation-delay: 250ms;">
                    <div class="flex justify-between items-center mb-3">  
                        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg flex items-center gap-2">
                            <i data-lucide="book-open" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
                            <span>Danh Sách Môn Học</span>
                        </h3>
                        <div id="totalSubjectsContainer" class="flex items-center gap-2">
                            <!-- Colored dots and total count inserted here -->
                        </div>
                    </div>      
                    <div id="allCoursesList" class="space-y-2 max-h-[250px] overflow-y-auto pr-1 pb-1">
                        <!-- All courses list inserted here via JS with staggering -->
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="courseModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-all duration-300 opacity-0">
        <div id="courseModalContent" class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-[95%] sm:w-full max-w-lg max-h-[80vh] flex flex-col overflow-hidden transform transition-all duration-300 scale-95 my-auto border border-slate-100 dark:border-slate-800">
            <!-- Modal Header -->
            <div class="bg-indigo-600 dark:bg-slate-800 px-5 py-4 sm:px-6 text-white flex justify-between items-center shrink-0 border-b border-transparent dark:border-slate-700">
                <h3 id="modalTitle" class="text-lg sm:text-lg font-bold">Thêm Môn Học Mới</h3>
                <button id="closeModalBtn" class="text-white/80 hover:text-white hover:bg-white/10 rounded-lg p-1.5 transition-colors active:scale-95">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <!-- Scrollable Content Area -->
            <div class="overflow-y-auto flex-grow px-5 pb-5 pt-3 sm:px-6 sm:pb-6 sm:pt-4 custom-scrollbar">
                <form id="courseForm" class="space-y-4 sm:space-y-5">
                    <input type="hidden" id="courseId">

                    <!-- Subject Name -->
                    <div class="animate-slide-up" style="animation-delay: 50ms;">
                        <label class="block text-ml font-medium text-slate-700 dark:text-slate-300 mb-1.5">Tên Môn Học *</label>
                        <input type="text" id="subjectName" required placeholder="Ví dụ: Lập Trình Web, Toán Cao Cấp..."
                            class="w-full px-4 py-3 sm:py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-base sm:text-sm bg-slate-50/50 dark:bg-slate-950 dark:text-white focus:bg-white dark:focus:bg-slate-900 placeholder:text-slate-400 dark:placeholder:text-slate-500">
                    </div>

                    <!-- Location / Room -->
                    <div class="animate-slide-up" style="animation-delay: 100ms;">
                        <label class="block text-ml font-medium text-slate-700 dark:text-slate-300 mb-1.5">Địa Điểm / Phòng Học</label>
                        <input type="text" id="location" placeholder="Ví dụ: Phòng A102, Tòa nhà B..."
                            class="w-full px-4 py-3 sm:py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-base sm:text-sm bg-slate-50/50 dark:bg-slate-950 dark:text-white focus:bg-white dark:focus:bg-slate-900 placeholder:text-slate-400 dark:placeholder:text-slate-500">
                    </div>

                    <!-- Date Range -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 animate-slide-up" style="animation-delay: 150ms;">
                        <div>
                            <label class="block text-ml font-medium text-slate-700 dark:text-slate-300 mb-1.5">Từ Ngày *</label>
                            <input type="date" id="startDate" required
                                class="w-full px-4 py-3 sm:py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm bg-slate-50/50 dark:bg-slate-950 dark:text-white focus:bg-white dark:focus:bg-slate-900 [color-scheme:light] dark:[color-scheme:dark]">
                        </div>
                        <div>
                            <label class="block text-ml font-medium text-slate-700 dark:text-slate-300 mb-1.5">Đến Ngày *</label>
                            <input type="date" id="endDate" required
                                class="w-full px-4 py-3 sm:py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm bg-slate-50/50 dark:bg-slate-950 dark:text-white focus:bg-white dark:focus:bg-slate-900 [color-scheme:light] dark:[color-scheme:dark]">
                        </div>
                    </div>

                    <!-- Days of Week Selection -->
                    <div class="animate-slide-up" style="animation-delay: 200ms;">
                        <label class="block text-ml font-medium text-slate-700 dark:text-slate-300 mb-2">Thứ Học Trong Tuần *</label>
                        <div class="grid grid-cols-7 gap-1 text-center">
                            <!-- Các thứ trong tuần -->
                            <label class="cursor-pointer">
                                <input type="checkbox" name="dow" value="1" class="peer hidden">
                                <div class="py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">T2</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="checkbox" name="dow" value="2" class="peer hidden">
                                <div class="py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">T3</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="checkbox" name="dow" value="3" class="peer hidden">
                                <div class="py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">T4</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="checkbox" name="dow" value="4" class="peer hidden">
                                <div class="py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">T5</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="checkbox" name="dow" value="5" class="peer hidden">
                                <div class="py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">T6</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="checkbox" name="dow" value="6" class="peer hidden">
                                <div class="py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">T7</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="checkbox" name="dow" value="0" class="peer hidden">
                                <div class="py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">CN</div>
                            </label>
                        </div>
                    </div>

                    <!-- Fixed Study Sessions -->
                    <div class="animate-slide-up" style="animation-delay: 250ms;">
                        <label class="block text-ml font-medium text-slate-700 dark:text-slate-300 mb-2">Ca / Buổi Học * </label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5" id="sessionContainer">
                            <label class="cursor-pointer group">
                                <input type="checkbox" name="sessionSlot" value="sang" data-start="07:00" data-end="11:20" class="peer hidden">
                                <div class="p-2.5 text-center border border-slate-200 dark:border-slate-700 rounded-xl peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-all group-hover:shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 peer-checked:hover:bg-indigo-600 dark:text-slate-300">
                                    <div class="text-sm font-bold">Tiết 1 - 5</div>
                                    <div class="text-[13px] opacity-80 mt-0.5">07:00 - 11:20</div>
                                </div>
                            </label>
                            <label class="cursor-pointer group">
                                <input type="checkbox" name="sessionSlot" value="chieu" data-start="13:00" data-end="17:20" class="peer hidden">
                                <div class="p-2.5 text-center border border-slate-200 dark:border-slate-700 rounded-xl peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-all group-hover:shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 peer-checked:hover:bg-indigo-600 dark:text-slate-300">
                                    <div class="text-sm font-bold">Tiết 7 - 11</div>
                                    <div class="text-[13px] opacity-80 mt-0.5">13:00 - 17:20</div>
                                </div>
                            </label>
                            <label class="cursor-pointer group">
                                <input type="checkbox" name="sessionSlot" value="toi" data-start="18:15" data-end="21:45" class="peer hidden">
                                <div class="p-2.5 text-center border border-slate-200 dark:border-slate-700 rounded-xl peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-all group-hover:shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 peer-checked:hover:bg-indigo-600 dark:text-slate-300">
                                    <div class="text-sm font-bold">Tiết 13 - 16</div>
                                    <div class="text-[13px] opacity-80 mt-0.5">18:15 - 21:45</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Color Selection -->
                    <div class="animate-slide-up" style="animation-delay: 300ms;">
                        <label class="block text-ml font-medium text-slate-700 dark:text-slate-300 mb-1.5">Màu Nhãn Đánh Dấu</label>
                        <div class="flex items-center space-x-3 overflow-x-auto p-1.5 custom-scrollbar" id="colorPickerContainer">
                            <!-- Colors dynamically rendered -->
                        </div>
                    </div>

                    <!-- Modal Actions -->
                    <div class="pt-4 flex justify-end space-x-3 border-t border-slate-100 dark:border-slate-800 animate-slide-up" style="animation-delay: 350ms;">
                        <button type="button" id="cancelModalBtn" class="px-5 py-2.5 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 active:bg-slate-100 dark:active:bg-slate-700 transition-colors text-sm">Hủy</button>
                        <button type="submit" class="px-6 py-2.5 bg-indigo-600 dark:bg-indigo-500 text-white font-medium rounded-xl hover:bg-indigo-700 dark:hover:bg-indigo-600 active:bg-indigo-800 active:scale-95 shadow-md hover-lift transition-all text-sm flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> Lưu Môn Học 
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div id="confirmDeleteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-all duration-300 opacity-0">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-sm p-6 text-center space-y-4 border border-transparent dark:border-slate-800 transform transition-all duration-300 scale-95" id="deleteModalContent">
            <div class="w-12 h-12 bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 rounded-full flex items-center justify-center mx-auto animate-pop-in">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Xác Nhận Xóa Môn Học</h3>
            <p class="text-sm text-slate-600 dark:text-slate-400">Bạn có chắc chắn muốn xóa môn học này khỏi lịch không? Thao tác này không thể hoàn tác.</p>
            <div class="flex items-center justify-center space-x-3 pt-2">
                <button id="cancelDeleteBtn" class="px-4 py-2 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-sm flex-1">Hủy</button>
                <button id="confirmDeleteBtn" class="px-4 py-2 bg-rose-600 dark:bg-rose-500 text-white font-medium rounded-lg hover:bg-rose-700 dark:hover:bg-rose-600 shadow active:scale-95 transition-all text-sm flex-1">Xóa Môn Học</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastNotification" class="fixed top-5 right-5 z-50 transform translate-x-full opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl border border-slate-700">
        <i id="toastIcon" data-lucide="info" class="w-5 h-5 text-indigo-400"></i>
        <span id="toastMessage" class="text-sm font-medium">Lưu thành công!</span>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // ------------------ PWA / OFFLINE SETUP ------------------
        function setupOfflineSupport() {
            // 1. Inject Manifest dynamically for PWA features
            const manifest = {
                name: "Quản Lý Lịch Học",
                short_name: "Lịch Học",
                description: "Quản lý lịch học cá nhân tiện lợi mọi lúc mọi nơi.",
                start_url: window.location.pathname,
                display: "standalone",
                background_color: "#ffffff",
                theme_color: "#4f46e5",
                icons: [
                    {
                        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z'/%3E%3C/svg%3E",
                        sizes: "192x192",
                        type: "image/svg+xml"
                    }
                ]
            };
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], { type: 'application/manifest+json' });
            const manifestURL = URL.createObjectURL(blob);
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);

            // 2. Inline Service Worker for basic caching
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'lich-hoc-offline-v1';
                    
                    self.addEventListener('install', event => {
                        self.skipWaiting();
                    });

                    self.addEventListener('activate', event => {
                        event.waitUntil(clients.claim());
                    });

                    self.addEventListener('fetch', event => {
                        // Chỉ cache các request GET
                        if (event.request.method !== 'GET') return;
                        
                        event.respondWith(
                            caches.match(event.request).then(cachedResponse => {
                                // Trả về cache nếu có, nếu không thì fetch từ mạng
                                return cachedResponse || fetch(event.request).then(response => {
                                    return caches.open(CACHE_NAME).then(cache => {
                                        // Cache các request thành công để dùng khi offline
                                        if (event.request.url.startsWith('http') && response.status === 200) {
                                            cache.put(event.request, response.clone());
                                        }
                                        return response;
                                    });
                                });
                            }).catch(() => {
                                // Bỏ qua lỗi khi offline, vì LocalStorage vẫn lưu dữ liệu học tập
                            })
                        );
                    });
                `;
                
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);

                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('✅ Tính năng Offline (Service Worker) đã sẵn sàng.'))
                    .catch(err => console.log('⚠️ Không thể đăng ký SW (bình thường trong một số môi trường web):', err));
            }
        }


        // ------------------ APP LOGIC ------------------
        function getCourseSessions(course) {
            if (course.sessions && Array.isArray(course.sessions) && course.sessions.length > 0) {
                return course.sessions;
            }
            return [{ startTime: course.startTime || '07:00', endTime: course.endTime || '11:20' }];
        }

        const COLOR_PALETTE = [
            { id: 'blue', hex: '#3b82f6' },
            { id: 'cyan', hex: '#06b6d4' },
            { id: 'amber', hex: '#f59e0b' },
            { id: 'rose', hex: '#f43f5e' },
            { id: 'purple', hex: '#8b5cf6' },
            { id: 'emerald', hex: '#10b981' },
            { id: 'orange', hex: '#f97316' }
        ];

        let courses = JSON.parse(localStorage.getItem('study_courses')) || [];
        let currentDate = new Date();
        let selectedDate = new Date();
        let selectedColor = COLOR_PALETTE[0].hex;
        let courseToDeleteId = null;
        let isMonthView = true;
        let currentTheme = 'light'; // Luôn mặc định là chế độ sáng khi load
        let touchStartX = 0;
        let touchEndX = 0;
        let modalTimeout; // Biến lưu timeout để fix lỗi mở form nhanh

        const calendarGrid = document.getElementById('calendarGrid');
        const currentMonthYearEl = document.getElementById('currentMonthYear');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');
        const todayBtn = document.getElementById('todayBtn');
        const compactToggleBtn = document.getElementById('compactToggleBtn');
        const compactToggleThumb = document.getElementById('compactToggleThumb');

        const selectedDateTitle = document.getElementById('selectedDateTitle');
        const selectedDateText = document.getElementById('selectedDateText');
        const dayScheduleList = document.getElementById('dayScheduleList');
        const allCoursesList = document.getElementById('allCoursesList');

        const courseModal = document.getElementById('courseModal');
        const courseForm = document.getElementById('courseForm');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const mobileFabBtn = document.getElementById('mobileFabBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const colorPickerContainer = document.getElementById('colorPickerContainer');
        const confirmDeleteModal = document.getElementById('confirmDeleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastNotification');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            if (isError) {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.className = 'w-5 h-5 text-rose-400';
            } else {
                toastIcon.setAttribute('data-lucide', 'check-circle-2');
                toastIcon.className = 'w-5 h-5 text-emerald-400';
            }
            lucide.createIcons();

            toast.classList.remove('translate-x-full', 'opacity-0');
            toast.classList.add('translate-x-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-x-0', 'opacity-100');
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        function initApp() {
            initTheme();
            lucide.createIcons();
            renderColorPicker();
            updateCompactToggleUI();
            renderCalendar();
            renderSelectedDaySchedule();
            renderCoursesOverview();
            setupEventListeners();
            setupMobileTouchEvents();
            setupOfflineSupport(); // Kích hoạt PWA
        }

        function initTheme() {
            if (currentTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            const icon = document.getElementById('themeIcon');
            // Hoạt ảnh xoay nhẹ khi đổi theme
            icon.style.transform = 'scale(0.5) rotate(180deg)';
            icon.style.opacity = '0.5';
            setTimeout(() => {
                icon.style.transform = 'scale(1) rotate(0deg)';
                icon.style.opacity = '1';
            }, 150);

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                currentTheme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                currentTheme = 'dark';
            }
        }

        function updateCompactToggleUI() {
            if (isMonthView) {
                compactToggleBtn.classList.remove('bg-slate-300', 'dark:bg-slate-600');
                compactToggleBtn.classList.add('bg-indigo-600');
                compactToggleThumb.classList.remove('translate-x-0');
                compactToggleThumb.classList.add('translate-x-5');
                compactToggleBtn.setAttribute('aria-checked', 'true');
            } else {
                compactToggleBtn.classList.remove('bg-indigo-600');
                compactToggleBtn.classList.add('bg-slate-300', 'dark:bg-slate-600');
                compactToggleThumb.classList.remove('translate-x-5');
                compactToggleThumb.classList.add('translate-x-0');
                compactToggleBtn.setAttribute('aria-checked', 'false');
            }
        }

        function getMondayOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function setupMobileTouchEvents() {
            calendarGrid.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            calendarGrid.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleCalendarSwipe();
            }, { passive: true });
        }

        function handleCalendarSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                if (!isMonthView) currentDate.setDate(currentDate.getDate() + 7);
                else currentDate.setMonth(currentDate.getMonth() + 1);
                
                // Thêm hoạt ảnh trượt nhẹ khi vuốt
                calendarGrid.classList.add('opacity-0', '-translate-x-4');
                setTimeout(() => {
                    renderCalendar();
                    calendarGrid.classList.remove('opacity-0', '-translate-x-4');
                }, 150);
                
            } else if (touchEndX > touchStartX + threshold) {
                if (!isMonthView) currentDate.setDate(currentDate.getDate() - 7);
                else currentDate.setMonth(currentDate.getMonth() - 1);
                
                calendarGrid.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => {
                    renderCalendar();
                    calendarGrid.classList.remove('opacity-0', 'translate-x-4');
                }, 150);
            }
        }

        function saveData() {
            localStorage.setItem('study_courses', JSON.stringify(courses));
        }

        function formatDateString(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function renderColorPicker() {
            colorPickerContainer.innerHTML = '';
            COLOR_PALETTE.forEach((col, index) => {
                const label = document.createElement('label');
                label.className = 'cursor-pointer p-0.5 flex-shrink-0 hover:scale-110 transition-transform';
                label.innerHTML = `
                    <input type="radio" name="colorOption" value="${col.hex}" class="peer hidden" ${index === 0 ? 'checked' : ''}>
                    <div class="w-7 h-7 rounded-full flex items-center justify-center transition-all peer-checked:ring-2 peer-checked:ring-black dark:peer-checked:ring-white peer-checked:ring-offset-1 peer-checked:scale-110" style="background-color: ${col.hex}">
                        <i data-lucide="check" class="w-4 h-4 text-white opacity-0 peer-checked:opacity-100"></i>
                    </div>
                `;
                label.querySelector('input').addEventListener('change', (e) => {
                    selectedColor = e.target.value;
                });
                colorPickerContainer.appendChild(label);
            });
            lucide.createIcons();
        }

        function getCoursesForDate(dateObj) {
            const dateStr = formatDateString(dateObj);
            const dayOfWeek = dateObj.getDay();
            return courses.filter(course => {
                if (dateStr < course.startDate || dateStr > course.endDate) return false;
                return course.daysOfWeek.includes(dayOfWeek);
            });
        }

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            // Xóa class hoạt ảnh cũ và thêm lại để trigger reflow
            calendarGrid.classList.remove('animate-fade-in');
            void calendarGrid.offsetWidth; // trigger reflow
            calendarGrid.classList.add('animate-fade-in');

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];

            if (!isMonthView) {
                const monday = getMondayOfWeek(currentDate);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                const startStr = `${monday.getDate()}/${monday.getMonth() + 1}`;
                const endStr = `${sunday.getDate()}/${sunday.getMonth() + 1}`;
                currentMonthYearEl.textContent = `Tuần (${startStr} - ${endStr}), ${year}`;

                for (let i = 0; i < 7; i++) {
                    const thisDate = new Date(monday);
                    thisDate.setDate(monday.getDate() + i);
                    const cell = createDayCell(thisDate, false, true);
                    cell.style.animationDelay = `${i * 30}ms`; // Stagger animation cho tuần
                    calendarGrid.appendChild(cell);
                }
            } else {
                currentMonthYearEl.textContent = `${monthNames[month]}, ${year}`;
                const firstDay = new Date(year, month, 1);
                const startingDayOfWeek = (firstDay.getDay() + 6) % 7;
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrevMonth = new Date(year, month, 0).getDate();

                for (let i = startingDayOfWeek - 1; i >= 0; i--) {
                    const prevDate = new Date(year, month - 1, daysInPrevMonth - i);
                    calendarGrid.appendChild(createDayCell(prevDate, true, false));
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const thisDate = new Date(year, month, day);
                    calendarGrid.appendChild(createDayCell(thisDate, false, false));
                }

                const totalCellsSoFar = startingDayOfWeek + daysInMonth;
                const remainingCells = (totalCellsSoFar > 35 ? 42 : 35) - totalCellsSoFar;
                for (let i = 1; i <= remainingCells; i++) {
                    const nextDate = new Date(year, month + 1, i);
                    calendarGrid.appendChild(createDayCell(nextDate, true, false));
                }
            }
        }

        function updateSelectedDayClass() {
            const selectedStr = formatDateString(selectedDate);
            Array.from(calendarGrid.children).forEach(c => {
                const isSelected = c.dataset.date === selectedStr;
                if (isSelected) {
                    c.classList.add('ring-2', 'ring-indigo-600', 'dark:ring-indigo-400', 'bg-indigo-50/60', 'dark:bg-indigo-900/40', 'font-semibold', 'shadow-sm', 'transform', 'scale-[1.02]');
                } else {
                    c.classList.remove('ring-2', 'ring-indigo-600', 'dark:ring-indigo-400', 'bg-indigo-50/60', 'dark:bg-indigo-900/40', 'font-semibold', 'shadow-sm', 'transform', 'scale-[1.02]');
                }
            });
        }

        function createDayCell(dateObj, isOtherMonth, isDetailedWeekView) {
            const cell = document.createElement('div');
            const dateStr = formatDateString(dateObj);
            const todayStr = formatDateString(new Date());
            const selectedStr = formatDateString(selectedDate);
            const isToday = dateStr === todayStr;
            const isSelected = dateStr === selectedStr;

            cell.dataset.date = dateStr;

            const sizeClass = isDetailedWeekView 
                ? 'min-h-[130px] sm:min-h-[180px]' 
                : 'aspect-square sm:aspect-auto sm:min-h-[85px]';

            // Thêm animate-pop-in để mỗi ô xuất hiện sinh động
            cell.className = `${sizeClass} animate-pop-in p-1 sm:p-1.5 border border-slate-100 dark:border-slate-800 rounded-xl flex flex-col justify-between cursor-pointer transition-all relative active:scale-95 ${
                isOtherMonth ? 'bg-slate-50/50 dark:bg-slate-900/50 text-slate-300 dark:text-slate-600' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50'
            } ${isSelected ? 'ring-2 ring-indigo-600 dark:ring-indigo-400 bg-indigo-50/60 dark:bg-indigo-900/40 font-semibold shadow-sm transform scale-[1.02]' : ''}`;

            const topBar = document.createElement('div');
            topBar.className = 'flex justify-between items-center';

            const numSpan = document.createElement('span');
            numSpan.className = `w-5 h-5 sm:w-7 sm:h-7 flex items-center justify-center text-[11px] sm:text-sm rounded-full transition-colors ${
                isToday ? 'bg-indigo-600 dark:bg-indigo-500 text-white font-bold shadow-md animate-soft-pulse' : ''
            }`;
            numSpan.textContent = dateObj.getDate();
            topBar.appendChild(numSpan);
            cell.appendChild(topBar);

            const dayCourses = getCoursesForDate(dateObj);

            if (isDetailedWeekView) {
                const coursesContainer = document.createElement('div');
                coursesContainer.className = 'flex flex-col gap-1 mt-1 flex-grow overflow-y-auto pr-0.5 custom-scrollbar';

                if (dayCourses.length > 0) {
                    const weekItems = [];
                    dayCourses.forEach(course => {
                        const sessions = getCourseSessions(course);
                        sessions.forEach(sess => {
                            weekItems.push({ ...course, startTime: sess.startTime, endTime: sess.endTime });
                        });
                    });

                    weekItems.sort((a, b) => a.startTime.localeCompare(b.startTime));
                    weekItems.forEach((course, idx) => {
                        const badge = document.createElement('div')
                        badge.className = 'animate-slide-up p-1.5 sm:p-2 rounded-md text-[10px] text-xs sm:text-sm font-semibold leading-tight flex flex-col shadow-sm truncate hover:opacity-80 transition-opacity';
                        badge.style.animationDelay = `${idx * 40}ms`; // Stagger chi tiết tuần
                        badge.style.backgroundColor = `${course.color}20`;
                        badge.style.borderLeft = `3px solid ${course.color}`;
                        badge.style.color = course.color;

                        badge.innerHTML = `
                            <span class="truncate font-bold text-slate-800 dark:text-slate-100" title="${course.name}">${course.name}</span>
                            <span class="opacity-80 mt-1 block truncate">${course.startTime} - ${course.endTime}</span>
                            ${course.location ? `<span class="opacity-80 block truncate">${course.location}</span>` : ''}
                        `;
                        coursesContainer.appendChild(badge);
                    });
                }
                cell.appendChild(coursesContainer);
            } else {
                const dotsContainer = document.createElement('div');
                dotsContainer.className = 'flex flex-wrap gap-1 sm:gap-1.5 mt-0.5 sm:mt-1 max-h-[22px] sm:max-h-[32px] overflow-hidden items-center justify-center flex-grow';

                if (dayCourses.length > 0) {
                    dayCourses.forEach((course, idx) => {
                        const dot = document.createElement('span');
                        dot.className = 'w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full inline-block shadow-sm transition-transform hover:scale-150 animate-pop-in';
                        dot.style.animationDelay = `${idx * 30}ms`;
                        dot.style.backgroundColor = course.color;
                        dot.title = course.name;
                        dotsContainer.appendChild(dot);
                    });
                }
                cell.appendChild(dotsContainer);
            }

            cell.addEventListener('click', () => {
                selectedDate = dateObj;
                updateSelectedDayClass();
                renderSelectedDaySchedule();
                
                // Hiệu ứng cuộn mượt xuống khi trên mobile
                if (window.innerWidth < 1024) {
                    const scheduleSection = document.getElementById('selectedScheduleSection');
                    if (scheduleSection) {
                        scheduleSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            });

            return cell;
        }

        function renderSelectedDaySchedule() {
            const dateStr = formatDateString(selectedDate);
            const todayStr = formatDateString(new Date());

            selectedDateTitle.textContent = dateStr === todayStr ? "Lịch Học Hôm Nay" : "Lịch Học Ngày";
            
            const options = { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' };
            selectedDateText.textContent = selectedDate.toLocaleDateString('vi-VN', options);

            const dayCourses = getCoursesForDate(selectedDate);
            dayScheduleList.innerHTML = '';

            if (dayCourses.length === 0) {
                dayScheduleList.innerHTML = `
                    <div class="text-center py-10 text-slate-400 dark:text-slate-500 animate-fade-in">
                        <i data-lucide="calendar-x" class="w-14 h-14 mx-auto mb-3 opacity-40"></i>
                        <p class="text-ml font-medium">Không có lịch học cho ngày này</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const scheduleItems = [];
            dayCourses.forEach(course => {
                const sessions = getCourseSessions(course);
                sessions.forEach(sess => {
                    scheduleItems.push({ ...course, startTime: sess.startTime, endTime: sess.endTime });
                });
            });

            scheduleItems.sort((a, b) => a.startTime.localeCompare(b.startTime));

            scheduleItems.forEach((course, index) => {
                const card = document.createElement('div');
                // Thêm hover-lift và stagger animation cho thẻ
                card.className = 'animate-slide-up hover-lift p-4 rounded-xl border border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-800 flex items-start space-x-3 cursor-default';
                card.style.animationDelay = `${index * 80}ms`;
                card.style.borderLeft = `5px solid ${course.color}`;
                card.style.backgroundColor = `${course.color}10`; 

                card.innerHTML = `
                    <div class="flex-grow">
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-base sm:text-lg">${course.name}</h4>
                        <div class="flex flex-col gap-2 text-sm text-slate-600 dark:text-slate-300 mt-2.5">
                            <span class="flex items-center gap-1.5 opacity-90">
                                <i data-lucide="calendar-range" class="w-3.5 h-3.5 text-slate-400"></i>
                                Từ ${formatDateDisplay(course.startDate)} đến ${formatDateDisplay(course.endDate)}
                            </span>
                            <span class="flex items-center gap-1.5 opacity-90">
                                <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400 dark:text-slate-400"></i>
                                <span>${course.startTime} - ${course.endTime}</span>
                            </span>                                
                            ${course.location ? `
                                <span class="flex items-center gap-1.5 opacity-90">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i>
                                    ${course.location}
                                </span>
                            ` : ''}
                        </div>
                    </div>
                `;
                dayScheduleList.appendChild(card);
            });

            lucide.createIcons();
        }

        function renderCoursesOverview() {
            allCoursesList.innerHTML = '';
            const totalSubjectsContainer = document.getElementById('totalSubjectsContainer');
            
            // Render phần tổng số môn học cùng các chấm màu (đại diện cho các môn)
            if (totalSubjectsContainer) {
                // Lấy ra danh sách các màu độc nhất (không trùng lặp)
                const uniqueColors = [...new Set(courses.map(c => c.color))];

                let dotsOverviewHtml = `<div class="flex -space-x-1.5 mr-1">`;
                uniqueColors.forEach(color => {
                    dotsOverviewHtml += `<div class="w-3.5 h-3.5 rounded-full border border-white shadow-sm" style="background-color: ${color}"></div>`;
                });
                dotsOverviewHtml += `</div>`;

                totalSubjectsContainer.innerHTML = `
                    ${uniqueColors.length > 0 ? dotsOverviewHtml : ''}
                    <span class="bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 text-xs font-bold px-2.5 py-1 rounded-full border border-indigo-100 dark:border-indigo-800 shadow-sm">Tổng: ${uniqueColors.length}</span>
                `;
            }

            if (courses.length === 0) {
                allCoursesList.innerHTML = `
                    <p class="text-sm text-slate-400 dark:text-slate-500 text-center py-6 animate-fade-in">Chưa có môn học nào được tạo.</p>
                `;
                return;
            }

            const daysMap = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

            courses.forEach((course, index) => {
                const daysText = course.daysOfWeek.map(d => daysMap[d]).join(', ');
                const sessions = getCourseSessions(course);
                const timesText = sessions.map(s => `${s.startTime} - ${s.endTime}`).join(' | ');

                const item = document.createElement('div');
                item.className = 'animate-slide-up p-3 rounded-xl border border-slate-100 dark:border-slate-800 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors group';
                item.style.animationDelay = `${index * 60}ms`;

                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="w-3 h-3 rounded-full flex-shrink-0 shadow-sm" style="background-color: ${course.color}"></span>
                        <div class="truncate">
                            <p class="text-sm font-semibold text-slate-800 dark:text-slate-100 truncate">${course.name}</p>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">${daysText} | ${timesText}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editCourse('${course.id}')" aria-label="Sửa môn học" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 rounded-lg transition-all active:scale-90">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button onclick="askDeleteCourse('${course.id}')" aria-label="Xóa môn học" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded-lg transition-all active:scale-90">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                allCoursesList.appendChild(item);
            });

            lucide.createIcons();
        }

        function openModal(isEdit = false) {
            document.getElementById('modalTitle').textContent = isEdit ? 'Chỉnh Sửa Môn Học' : 'Thêm Môn Học Mới';
            courseModal.classList.remove('hidden');
            courseModal.classList.add('flex');
            
            // Trigger animation
            setTimeout(() => {
                courseModal.classList.remove('opacity-0');
                courseModal.classList.add('opacity-100');
                const content = document.getElementById('courseModalContent');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);

            setTimeout(() => { 
                // Tránh tự động focus trên điện thoại để không làm bàn phím ảo bật lên gây lỗi giao diện trắng form
                if (window.innerWidth >= 400) {
                    document.getElementById('subjectName').focus(); 
                } 
            }, 100);
        }

        function closeModal() {
            courseModal.classList.remove('opacity-100');
            courseModal.classList.add('opacity-0');
            const content = document.getElementById('courseModalContent');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');

            setTimeout(() => {
                courseModal.classList.add('hidden');
                courseModal.classList.remove('flex');
                courseForm.reset();
                document.getElementById('courseId').value = '';
                selectedColor = COLOR_PALETTE[0].hex;
                renderColorPicker();
            }, 300);
        }

        window.editCourse = function(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return;

            document.getElementById('courseId').value = course.id;
            document.getElementById('subjectName').value = course.name;
            document.getElementById('location').value = course.location || '';
            document.getElementById('startDate').value = course.startDate;
            document.getElementById('endDate').value = course.endDate;

            const sessionInputs = courseForm.querySelectorAll('input[name="sessionSlot"]');
            sessionInputs.forEach(input => input.checked = false);

            const courseSessions = getCourseSessions(course);
            courseSessions.forEach(sess => {
                sessionInputs.forEach(input => {
                    if (input.getAttribute('data-start') === sess.startTime && input.getAttribute('data-end') === sess.endTime) {
                        input.checked = true;
                    }
                });
            });

            const checkboxes = courseForm.querySelectorAll('input[name="dow"]');
            checkboxes.forEach(cb => { cb.checked = course.daysOfWeek.includes(parseInt(cb.value)); });

            selectedColor = course.color;
            const colorInputs = courseForm.querySelectorAll('input[name="colorOption"]');
            colorInputs.forEach(input => { if (input.value === course.color) input.checked = true; });

            openModal(true);
        };

        window.askDeleteCourse = function(id) {
            courseToDeleteId = id;
            confirmDeleteModal.classList.remove('hidden');
            confirmDeleteModal.classList.add('flex');

            setTimeout(() => {
                confirmDeleteModal.classList.remove('opacity-0');
                confirmDeleteModal.classList.add('opacity-100');
                document.getElementById('deleteModalContent').classList.remove('scale-95');
                document.getElementById('deleteModalContent').classList.add('scale-100');
            }, 10);
        };

        function closeDeleteModal() {
            courseToDeleteId = null;
            confirmDeleteModal.classList.remove('opacity-100');
            confirmDeleteModal.classList.add('opacity-0');
            document.getElementById('deleteModalContent').classList.remove('scale-100');
            document.getElementById('deleteModalContent').classList.add('scale-95');
            
            setTimeout(() => {
                confirmDeleteModal.classList.add('hidden');
                confirmDeleteModal.classList.remove('flex');
            }, 300);
        }

        function setupEventListeners() {
            themeToggleBtn.addEventListener('click', toggleTheme);

            compactToggleBtn.addEventListener('click', () => {
                isMonthView = !isMonthView;
                currentDate = new Date(selectedDate);
                updateCompactToggleUI();
                renderCalendar();
            });

            prevMonthBtn.addEventListener('click', () => {
                if (!isMonthView) currentDate.setDate(currentDate.getDate() - 7);
                else currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', () => {
                if (!isMonthView) currentDate.setDate(currentDate.getDate() + 7);
                else currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            todayBtn.addEventListener('click', () => {
                currentDate = new Date();
                selectedDate = new Date();
                renderCalendar();
                renderSelectedDaySchedule();
            });

            const handleOpenModal = () => {
                document.getElementById('startDate').value = formatDateString(new Date());
                const defaultEndDate = new Date();
                defaultEndDate.setMonth(defaultEndDate.getMonth() + 3);
                document.getElementById('endDate').value = formatDateString(defaultEndDate);
                openModal(false);
            };

            openAddModalBtn.addEventListener('click', handleOpenModal);
            if (mobileFabBtn) mobileFabBtn.addEventListener('click', handleOpenModal);

            closeModalBtn.addEventListener('click', closeModal);
            cancelModalBtn.addEventListener('click', closeModal);

            courseModal.addEventListener('mousedown', (e) => {
                if (e.target === courseModal) closeModal();
            });

            confirmDeleteModal.addEventListener('mousedown', (e) => {
                if (e.target === confirmDeleteModal) closeDeleteModal();
            });

            cancelDeleteBtn.addEventListener('click', closeDeleteModal);
            confirmDeleteBtn.addEventListener('click', () => {
                if (courseToDeleteId) {
                    courses = courses.filter(c => c.id !== courseToDeleteId);
                    saveData();
                    closeDeleteModal();
                    renderCalendar();
                    renderSelectedDaySchedule();
                    renderCoursesOverview();
                    showToast('Đã xóa môn học thành công!');
                }
            });

            courseForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const courseId = document.getElementById('courseId').value;
                const name = document.getElementById('subjectName').value.trim();
                const location = document.getElementById('location').value.trim();
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                
                const selectedSessions = Array.from(courseForm.querySelectorAll('input[name="sessionSlot"]:checked'))
                    .map(cb => ({ slot: cb.value, startTime: cb.getAttribute('data-start'), endTime: cb.getAttribute('data-end') }));

                if (selectedSessions.length === 0) { showToast('Vui lòng chọn ít nhất một ca/buổi học!', true); return; }

                const selectedDows = Array.from(courseForm.querySelectorAll('input[name="dow"]:checked')).map(cb => parseInt(cb.value));

                if (selectedDows.length === 0) { showToast('Vui lòng chọn ít nhất một thứ trong tuần!', true); return; }
                if (startDate > endDate) { showToast('Ngày kết thúc phải lớn hơn ngày bắt đầu!', true); return; }

                const primaryStartTime = selectedSessions[0].startTime;
                const primaryEndTime = selectedSessions[selectedSessions.length - 1].endTime;

                if (courseId) {
                    const index = courses.findIndex(c => c.id === courseId);
                    if (index !== -1) {
                        courses[index] = { id: courseId, name, location, startDate, endDate, daysOfWeek: selectedDows, sessions: selectedSessions, startTime: primaryStartTime, endTime: primaryEndTime, color: selectedColor };
                    }
                    showToast('Đã cập nhật môn học thành công!');
                } else {
                    courses.push({ id: Date.now().toString(), name, location, startDate, endDate, daysOfWeek: selectedDows, sessions: selectedSessions, startTime: primaryStartTime, endTime: primaryEndTime, color: selectedColor });
                    showToast('Đã thêm môn học mới vào lịch!');
                }

                saveData();
                closeModal();
                renderCalendar();
                renderSelectedDaySchedule();
                renderCoursesOverview();
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
